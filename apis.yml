name: Gilt Groupe
description: >-
  Gilt Groupe is a New York-based online retailer that pioneered the "flash
  sale" model in the United States, offering limited-time, members-only sales
  of discounted designer fashion, luxury goods, home items, and travel. Founded
  in 2007, Gilt was acquired by Hudson's Bay Company in 2016 and subsequently
  sold to Rue La La in 2018, forming Rue Gilt Groupe; the gilt.com storefront
  remains operational. Gilt's engineering team was an influential early adopter
  of Scala and microservices and open-sourced roughly fifty JVM libraries (the
  "gfc" Gilt Foundation Classes, Handlebars-Scala, sbt plugins) to Maven Central
  under the com.gilt groupId. Gilt operated no public REST API at the time of
  this enrichment pass - its historical developer.gilt.com API and the
  github.com/gilt organization are both retired. Surfaced as a portfolio company
  of Matrix Partners and profiled in the API Evangelist network.
