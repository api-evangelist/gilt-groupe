description: >-
  First-party open-source JVM/Scala libraries published by Gilt Groupe's
  engineering team to Maven Central under the com.gilt groupId. These are
  general-purpose foundation and infrastructure libraries (the "gfc" Gilt
  Foundation Classes, Handlebars templating, AWS helpers, sbt plugins), not
  clients for a hosted Gilt API. Gilt operated no public REST API at the time
  of this pass; its historical developer.gilt.com API and github.com/gilt
  organization are both retired.
